# ── Custom Anti-Flood & Anti-Scan Rules (CIS/NIST) ──
# Add these to the ufw-before-input chain

# Drop INVALID packets (already in before.rules, but ensure logging)
-A ufw-before-input -m conntrack --ctstate INVALID -j LOG --log-prefix "[UFW INVALID] " --log-level 6
-A ufw-before-input -m conntrack --ctstate INVALID -j DROP

# Anti SYN flood - limit new SYN packets per second
-A ufw-before-input -p tcp --syn -m limit --limit 75/s --limit-burst 150 -j ACCEPT
-A ufw-before-input -p tcp --syn -j DROP

# Anti port scan - log and drop repeated connection attempts
-A ufw-before-input -p tcp --tcp-flags ALL NONE -m limit --limit 3/min --limit-burst 5 -j LOG --log-prefix "[UFW NULL SCAN] " --log-level 6
-A ufw-before-input -p tcp --tcp-flags ALL NONE -j DROP

# Anti XMAS scan
-A ufw-before-input -p tcp --tcp-flags ALL ALL -m limit --limit 3/min --limit-burst 5 -j LOG --log-prefix "[UFW XMAS SCAN] " --log-level 6
-A ufw-before-input -p tcp --tcp-flags ALL ALL -j DROP

# Anti FIN scan
-A ufw-before-input -p tcp --tcp-flags ALL FIN,URG,PSH -m limit --limit 3/min --limit-burst 5 -j LOG --log-prefix "[UFW FIN SCAN] " --log-level 6
-A ufw-before-input -p tcp --tcp-flags ALL FIN,URG,PSH -j DROP

# Anti SYN scan (SYN without ACK)
-A ufw-before-input -p tcp --tcp-flags SYN,ACK SYN -m limit --limit 3/min --limit-burst 5 -j LOG --log-prefix "[UFW SYN SCAN] " --log-level 6

# Drop packets from private addresses coming in on external interfaces (anti-spoofing)
-A ufw-before-input -s 10.0.0.0/8 -j DROP
-A ufw-before-input -s 172.16.0.0/12 -j DROP
-A ufw-before-input -s 192.168.0.0/16 -j DROP
-A ufw-before-input -s 169.254.0.0/16 -j DROP
-A ufw-before-input -s 127.0.0.0/8 ! -i lo -j DROP

# Rate limit ICMP (ping flood protection)
-A ufw-before-input -p icmp --icmp-type echo-request -m limit --limit 1/s --limit-burst 5 -j ACCEPT
-A ufw-before-input -p icmp --icmp-type echo-request -j DROP

# Log blocked traffic (for monitoring)
-A ufw-before-input -m limit --limit 5/min --limit-burst 10 -j LOG --log-prefix "[UFW BLOCK] " --log-level 4
