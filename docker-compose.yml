services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kreatixtech-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 5100
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://kreatixtech.com,https://www.kreatixtech.com,http://kreatixtech.com,http://www.kreatixtech.com,http://67.211.210.8
      RESEND_API_KEY: ${RESEND_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: kreatixtech
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      ADMIN_SECRET: ${ADMIN_SECRET}
    networks:
      - kreatixtech-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && node server.js"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kreatixtech-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5180:80"
    networks:
      - kreatixtech-net

networks:
  kreatixtech-net:
    driver: bridge
